name: Monday public-only dashboard refresh

# Replaces the legacy Hermes/daneelbrain Monday 7 AM ET cron that rewrote
# index.html without filtering private repos (leak on 2026-09-28).
# 11:00 UTC = 7:00 AM America/New_York during EDT; 12:00 UTC during EST.
# Running both covers the DST ambiguity within ~1 hour.

on:
  schedule:
    - cron: "0 11 * * 1"
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-dashboard-monday-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate public-only index.html
        env:
          DASHBOARD_REPO_ROOT: ${{ github.workspace }}
          DASHBOARD_SKIP_PUSH: "1"
          # Prefer public API path via missing gh visibility if needed;
          # generate.py also calls gh with --visibility public when available.
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 generate.py
          if grep -qE 'repo-name">🔐' index.html; then
            echo "::error::Private-repo marker found in generated index.html"
            exit 1
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No dashboard changes"
            exit 0
          fi
          git commit -m "Update dashboard $(TZ=America/New_York date '+%Y-%m-%d %H:%M')"
          git push origin HEAD:${{ github.ref_name }}
